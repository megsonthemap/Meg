<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Reel Review</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,500..900&family=Inter:wght@400;500;600&display=swap">
<style>
  .smgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px} .smlist{margin:8px 0 0;padding-left:18px} .smlist li{margin:5px 0} .smrule{padding:12px 0;border-top:1px solid var(--line)}
  .looks{display:grid;grid-template-columns:repeat(2,1fr);gap:5px} .look{background:none;border:2px solid transparent;border-radius:7px;padding:0;cursor:pointer;color:var(--muted);font-size:11px;line-height:1.2} .look img{width:100%;aspect-ratio:9/16;object-fit:cover;border-radius:5px;display:block} .look span{display:block;padding:2px 0} .look.on{border-color:var(--yellow);color:var(--fg)}
  .qf{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
  .mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px} .mtile{position:relative;background:var(--panel2,#222);border-radius:12px;padding:8px;display:flex;flex-direction:column;gap:6px} .mimg{width:100%;aspect-ratio:9/16;object-fit:cover;border-radius:8px;background:#000} .mnum{position:absolute;top:12px;left:12px;background:var(--yellow);color:#151515;font-weight:800;border-radius:999px;min-width:26px;height:26px;display:grid;place-items:center;font-size:13px;z-index:1} .mlab{font-size:12px;line-height:1.3} .mtile textarea{font-size:13px;min-height:44px;font-family:inherit} .chipbtn{background:#2c3330;color:var(--fg);border:0;border-radius:8px;padding:6px 8px;font-size:12px;cursor:pointer;min-height:32px}
  .tap .chips{display:flex;flex-wrap:wrap;gap:6px} .tapvid{width:100%;max-height:60vh;border-radius:10px;background:#000;margin-top:8px} .tapin{flex:1;min-width:140px;background:var(--panel2,#222);color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:9px 12px;font:inherit} .cgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px} .cgrid .tile img{aspect-ratio:9/16;object-fit:cover} .pending ul.chg{margin:0;padding-left:18px;font-size:13px;line-height:1.5} .shelfdrop{border:1px dashed var(--line);border-radius:12px;padding:14px;text-align:center;color:var(--muted);cursor:pointer;margin:8px 0} .shelfdrop.over{border-color:var(--yellow);color:var(--fg)} .blk.dragging{opacity:.85;outline:2px dashed var(--yellow);z-index:4} .blk.moved{outline:2px dashed var(--yellow)} .overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);display:grid;place-items:center;z-index:50;padding:16px} .cmp{width:min(900px,100%);max-height:94vh;overflow:auto} .cmpgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px} .cmpgrid .vid{height:min(62vh,640px)} .cmpgrid video{width:100%;height:100%;object-fit:contain;background:#000} .tgrid.hooks .tile img{aspect-ratio:9/16;object-fit:cover} @media (max-width:640px){.cgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
  /* The review workspace: the page never scrolls on a computer; video, note box and timeline stay put, the right column scrolls on its own */
  .tabs{display:flex;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:4px;margin-bottom:10px;flex-shrink:0}
  .tabs button{flex:1;border:0;background:none;color:var(--muted);border-radius:999px;padding:7px 10px;font-weight:600;font-size:13px}
  .tabs button[aria-selected="true"]{background:var(--fg);color:var(--bg)}
  .pane{display:none;gap:12px} .pane.on{display:grid;align-content:start}
  .changehint{padding:4px 2px} .pane .tap:not([style*="none"]) ~ .changehint{display:none}
  .box.dock{gap:8px;padding:10px} .dock textarea{min-height:44px !important;height:44px;resize:none} .row.dockrow{flex-wrap:nowrap;align-items:stretch} .dockrow textarea{flex:1} .dockrow .btn{white-space:nowrap}
  .dock .qf{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding-bottom:2px} .dock .qf::-webkit-scrollbar{display:none} .dock .qf .hint{display:none} .dock .qf .chipbtn{white-space:nowrap;flex-shrink:0}
  .pendbar{display:flex;align-items:center;gap:10px;background:rgba(254,252,142,.12);border:1px solid rgba(254,252,142,.35);border-radius:999px;padding:4px 6px 4px 14px;font-size:13px;position:relative}
  .pendbar summary{cursor:pointer;font-weight:600;color:var(--yellow);list-style:none} .pendbar summary::after{content:' ▾';color:var(--muted)}
  .pendbar details[open] ul{position:absolute;top:calc(100% + 6px);left:0;z-index:30;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 14px 10px 28px;min-width:300px;box-shadow:0 8px 24px rgba(0,0,0,.4)}
  .btn.sm{padding:6px 12px;font-size:13px}
  @media(min-width:900px){
    body.ws .wrap{max-width:1500px;height:100vh;height:100dvh;display:flex;flex-direction:column;padding-block:10px 10px}
    body.ws .top{margin-bottom:4px} body.ws .top h1{display:none} body.ws .top .sub{font-family:var(--display);font-stretch:112%;font-weight:800;text-transform:uppercase;color:var(--fg);font-size:14px}
    body.ws #main > .row:first-child{margin-bottom:8px !important}
    body.ws .box.dock{padding:8px;gap:6px} body.ws .tabs{padding:3px;margin-bottom:8px} body.ws .tabs button{padding:5px 10px}
    body.ws .note{padding:8px 10px;gap:8px} body.ws .note .meta{margin-top:2px}
    body.ws .tl{--rh:24px;padding:6px 8px} body.ws .tlbar{margin-bottom:4px} body.ws .tlbar .hint{font-size:11px} body.ws .ruler{height:18px}
    body.tlmin .tlgrid{display:none} body.tlmin .tlbar{margin-bottom:0}
    body.ws #main{flex:1;min-height:0;display:flex;flex-direction:column}
    body.ws .view.ws{flex:1;min-height:0;grid-template-columns:minmax(260px,calc((100dvh - 150px) * 9 / 16)) minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto;grid-template-areas:'stage side' 'stage tl';align-items:stretch;gap:12px}
    body.ws .stage{min-height:0;display:flex;flex-direction:column;gap:8px;overflow:hidden}
    body.ws .stage .vid{flex:1 1 0;min-height:300px;height:auto;width:100%;max-width:100%;aspect-ratio:auto;align-self:stretch}
    body.ws .stage .vid video{object-fit:contain}
    body.ws .stage > :not(.vid){flex-shrink:0}
    body.ws .now{min-height:0;padding-top:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    body.ws .side > .dock{flex-shrink:0;margin-bottom:10px}
    body.ws .side{display:flex;flex-direction:column;min-height:0}
    body.ws .pane.on{flex:1;min-height:0;overflow:auto;padding-right:4px}
    body.ws .stage{grid-area:stage} body.ws .side{grid-area:side} body.ws .tlrow{grid-area:tl;min-width:0}
    body.ws .tl{padding:8px}
  }
  @media(max-width:899px){
    body.ws .stage{position:sticky;top:0;z-index:15;background:var(--bg);padding-top:4px}
    body.ws .vid{height:34vh}
    body.ws .box.dock{position:fixed;left:0;right:0;bottom:0;z-index:25;border-radius:16px 16px 0 0;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));background:var(--panel)}
    body.ws #main{padding-bottom:130px}
    body.ws .now{display:none}
    body.ws .row.dockrow{flex-wrap:wrap} body.ws .dockrow textarea{flex:1 1 100%} body.ws .dockrow .btn{padding:8px 14px;font-size:14px}
  }
  .cutwrap{display:grid;grid-template-columns:minmax(160px,240px) 1fr;gap:14px;align-items:start} .cutvid{width:100%;aspect-ratio:9/16;border-radius:10px;background:#000} .cutlines{display:flex;flex-direction:column;gap:6px;max-height:520px;overflow:auto} .cutline{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;background:var(--panel2,#222);border-radius:10px;padding:8px} .cutline .ct{font-size:14px;line-height:1.35} .cutline.off .ct{text-decoration:line-through;opacity:.45} @media (max-width:640px){.cutwrap{grid-template-columns:1fr} .cutvid{max-height:60vh}}
  .maconly{margin-left:6px;font-size:10px;font-weight:700;letter-spacing:.04em;padding:1px 6px;border-radius:6px;background:#2c3330;color:#b9c4bf;vertical-align:middle}
  .wlog{list-style:none;margin:10px 0 0;padding:0} .wlog li{display:flex;gap:10px;align-items:flex-start;padding:5px 0;font-size:14px;color:var(--muted)} .wlog li .m{flex:1} .wlog li .tm{font-size:12px;opacity:.6;white-space:nowrap} .wlog .dot{width:9px;height:9px;border-radius:50%;background:#5f6b66;margin-top:6px;flex:none} .wlog li.now{color:var(--fg);font-weight:600} .wlog li.now .dot{background:var(--yellow);box-shadow:0 0 0 0 rgba(254,252,142,.7);animation:wpulse 1.4s infinite} @keyframes wpulse{0%{box-shadow:0 0 0 0 rgba(254,252,142,.6)}70%{box-shadow:0 0 0 9px rgba(254,252,142,0)}100%{box-shadow:0 0 0 0 rgba(254,252,142,0)}} .wstill{width:100%;border-radius:10px;display:block} .wdone{margin-top:12px} .wdone summary{cursor:pointer;color:var(--muted);font-size:13px}
  .plan{margin-top:14px} .md table{border-collapse:collapse;width:100%;font-size:13px;margin:8px 0} .md th,.md td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top} .md th{color:var(--muted,#9aa)} .md h3,.md h4,.md h5{margin:14px 0 6px} .md ul,.md ol{padding-left:20px} .md p{margin:6px 0} .work{margin-top:12px;padding:14px;border:1px solid var(--line);border-radius:14px}
/* Layout: a dark screening room. Phone: video, timeline, notes stacked. Desktop: video left, notes right. */
:root{
  --bg:#141514; --panel:#1D1F1E; --panel2:#262927; --line:#333735; --fg:#EDEDE8; --muted:#9A9D97;
  --yellow:#FEFC8E; --blue:#AFC0DA; --green:#8FD3A8; --red:#F07C74; --pink:#E7A6C8;
  --display:'Archivo','Helvetica Neue',Arial,sans-serif; --body:'Inter',-apple-system,'Helvetica Neue',sans-serif;
  color-scheme:dark; --rh:34px;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45;margin:0}
.wrap{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:18px 60px}
h1,h2{font-family:var(--display);font-stretch:112%;font-weight:900;text-transform:uppercase;letter-spacing:.005em;margin:0;line-height:1}
h1{font-size:26px} h2{font-size:18px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
.top .sub{color:var(--muted);font-size:13px}
button,select{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--yellow);outline-offset:2px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--panel2);color:var(--muted);white-space:nowrap}
.pill.review{background:color-mix(in srgb,var(--blue) 18%,transparent);color:var(--blue)}
.pill.changes{background:color-mix(in srgb,var(--red) 16%,transparent);color:var(--red)}
.pill.approved{background:color-mix(in srgb,var(--green) 16%,transparent);color:var(--green)}
.list{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;text-align:left;display:grid;gap:10px;min-width:0}
.card:hover{border-color:#4a4f4c}
.card .t{font-family:var(--display);font-stretch:112%;font-weight:800;font-size:17px;text-transform:uppercase;line-height:1.05}
.card .m{display:flex;gap:8px;flex-wrap:wrap;color:var(--muted);font-size:13px}
.empty{background:var(--panel);border:1px dashed var(--line);border-radius:16px;padding:28px;color:var(--muted);max-width:620px}
.empty b{color:var(--fg)}
.empty code{background:var(--panel2);border-radius:5px;padding:1px 6px;font-size:13px}
.back{background:none;border:0;color:var(--muted);padding:0;font-size:14px}
.view{display:grid;gap:18px;grid-template-columns:minmax(0,1fr)}
.tlrow{min-width:0}
@media(max-width:899px){.tlrow{order:2}.side{order:3}}
@media(min-width:900px){.view{grid-template-columns:minmax(0,380px) minmax(0,1fr);align-items:start}.tlrow{grid-column:1 / -1}.vid{height:min(48vh,560px)}}
.stage{display:grid;gap:12px;min-width:0}
.vid{position:relative;background:#000;border-radius:16px;overflow:hidden;aspect-ratio:9/16;height:min(54vh,620px);max-width:100%;margin:0 auto}
.vid video{width:100%;height:100%;display:block;object-fit:contain;background:#000}
.ctrls{display:flex;align-items:center;gap:10px}
.play{width:44px;height:44px;border-radius:22px;border:0;background:var(--yellow);color:#141514;font-size:18px;font-weight:900;flex-shrink:0}
.tc{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px}
.speed{margin-left:auto;background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:12px;color:var(--fg)}
.vsel{background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:6px 10px;font-size:12px;color:var(--fg)}
.older{background:color-mix(in srgb,var(--yellow) 14%,transparent);border:1px solid color-mix(in srgb,var(--yellow) 40%,transparent);border-radius:12px;padding:8px 12px;font-size:13px;color:var(--fg);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.older button{border:0;background:var(--yellow);color:#141514;border-radius:999px;padding:5px 12px;font-weight:600;font-size:12px}
.tl{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px;user-select:none}
.tlbar{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.tlbar .hint{margin-right:auto}
.zoom{display:flex;gap:4px}
.zoom button{border:1px solid var(--line);background:none;border-radius:8px;padding:4px 10px;font-size:12px;color:var(--muted)}
.zoom button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.tlgrid{display:grid;grid-template-columns:92px minmax(0,1fr);gap:0}
.names{display:grid;align-content:start}
.names div{height:var(--rh);display:flex;align-items:center;font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--line);padding-right:6px}
.names div i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px;flex-shrink:0}
.scroller{overflow-x:auto;overflow-y:hidden;touch-action:pan-x;border-left:1px solid var(--line);-webkit-overflow-scrolling:touch}
.lanes{position:relative;min-width:100%}
.ruler{height:22px;position:relative;border-bottom:1px solid var(--line)}
.ruler span{position:absolute;top:4px;font-size:10px;color:var(--muted);transform:translateX(-50%);font-variant-numeric:tabular-nums}
.ruler b{position:absolute;bottom:0;width:1px;height:6px;background:#555}
.lane{position:relative;height:var(--rh);border-bottom:1px solid var(--line)}
.lane:nth-child(odd){background:rgba(255,255,255,.02)}
.blk{position:absolute;top:5px;bottom:5px;border-radius:6px;font-size:11px;font-weight:600;color:#141514;padding:0 6px;display:flex;align-items:center;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;cursor:pointer;border:1px solid rgba(0,0,0,.25);min-width:4px}
.blk.on{outline:2px solid #fff;outline-offset:1px}
.blk.text{background:var(--yellow)} .blk.cap{background:#E9E6DA} .blk.media{background:var(--blue)} .blk.ui{background:var(--green)} .blk.move{background:var(--pink)}
.cut{position:absolute;top:6px;bottom:6px;width:2px;margin-left:-1px;background:#8a908c;border-radius:1px}
.pin{position:absolute;top:50%;width:16px;height:16px;margin:-8px 0 0 -8px;background:var(--red);border-radius:8px 8px 8px 2px;transform:rotate(-45deg);cursor:pointer}
.pin.done{background:#5d6460}
.head{position:absolute;top:0;bottom:0;width:2px;margin-left:-1px;background:#fff;box-shadow:0 0 8px rgba(255,255,255,.8);pointer-events:none;z-index:3}
.head::before{content:'';position:absolute;top:0;left:-6px;border-left:7px solid transparent;border-right:7px solid transparent;border-top:9px solid #fff}
.now{min-height:20px;font-size:13px;color:var(--muted);padding:8px 2px 0}
.now b{color:var(--fg);font-weight:600}
.side{display:grid;gap:14px;min-width:0}
.box{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;display:grid;gap:10px}
.compose textarea{width:100%;min-height:76px;resize:vertical;background:var(--panel2);color:var(--fg);border:1px solid var(--line);border-radius:12px;padding:12px;font:inherit}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{border:0;border-radius:999px;padding:10px 16px;font-weight:600;background:var(--panel2);color:var(--fg)}
.btn.y{background:var(--yellow);color:#141514}
.btn.g{background:color-mix(in srgb,var(--green) 18%,transparent);color:var(--green)}
.btn:disabled{opacity:.45;cursor:default}
.notes{display:grid;gap:8px}
.note{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:start;background:var(--panel2);border-radius:12px;padding:10px 12px}
.note.done{opacity:.55}
.note.done .txt{text-decoration:line-through}
.stamp{font-variant-numeric:tabular-nums;font-weight:700;color:var(--yellow);background:none;border:0;padding:2px 0;font-size:14px}
.txt{white-space:pre-wrap;word-break:break-word;min-width:0}
.meta{font-size:11px;color:var(--muted);margin-top:4px}
.tick{width:26px;height:26px;border-radius:13px;border:2px solid #5d6460;background:none;color:#141514;font-weight:900;display:grid;place-items:center;padding:0}
.note.done .tick{background:var(--green);border-color:var(--green)}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:none;border-radius:999px;padding:5px 12px;font-size:12px;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.hint{font-size:12px;color:var(--muted)}
.steps{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:4px}
.steps span{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:4px 10px;border-radius:999px;background:var(--panel2);color:var(--muted)}
.steps span.on{background:var(--yellow);color:#141514}
.modes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.mode{background:var(--panel2);border:2px solid transparent;border-radius:14px;padding:12px;text-align:left;color:var(--fg);display:grid;gap:4px}
.mode b{font-family:var(--display);font-stretch:112%;font-weight:800;text-transform:uppercase;font-size:14px}
.mode.on{border-color:var(--yellow)}
.swatches{display:flex;gap:6px;margin-top:4px}.swatches i{width:18px;height:18px;border-radius:50%;border:1px solid #0003;display:block}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:8px}
.tile{position:relative;background:var(--panel2);border:2px solid transparent;border-radius:12px;padding:0;overflow:hidden;text-align:left;color:var(--fg);display:grid}
.tile img{width:100%;aspect-ratio:9/14;object-fit:cover;display:block;background:#000}
.tile .nm{padding:7px 8px 8px;font-size:12px;font-weight:700;line-height:1.2}
.tile .ds{padding:0 8px 8px;font-size:11px;color:var(--muted);line-height:1.3}
.tile.on{border-color:var(--yellow)}
.tile.on::after{content:'✓';position:absolute;top:6px;right:6px;width:24px;height:24px;border-radius:50%;background:var(--yellow);color:#141514;display:grid;place-items:center;font-weight:900;font-size:14px}
.chips{display:flex;gap:6px;flex-wrap:wrap}.chips button{border:0;border-radius:999px;padding:6px 12px;background:var(--panel2);color:var(--muted);font-weight:600;font-size:12px}.chips button.on{background:var(--fg);color:#141514}
.check{display:flex;gap:8px;align-items:center;font-size:13px;font-weight:600}
@media (max-width:520px){.modes{grid-template-columns:1fr}}

.err{color:var(--red);font-size:13px}
.drop{background:var(--panel);border:2px dashed var(--line);border-radius:16px;padding:34px 20px;text-align:center;display:grid;gap:8px;cursor:pointer}
.drop.over{border-color:var(--yellow);background:color-mix(in srgb,var(--yellow) 8%,var(--panel))}
.drop b{font-family:var(--display);font-stretch:112%;font-weight:800;text-transform:uppercase;font-size:17px}
.drop .hint{max-width:40ch;margin:0 auto}
.files{display:grid;gap:6px;font-size:13px}
.files div{display:flex;justify-content:space-between;gap:10px;background:var(--panel2);border-radius:10px;padding:8px 12px}
.files div span:last-child{color:var(--muted);font-variant-numeric:tabular-nums;flex-shrink:0}
.field{display:grid;gap:6px}
.field label{font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.field textarea{width:100%;min-height:96px;resize:vertical;background:var(--panel2);color:var(--fg);border:1px solid var(--line);border-radius:12px;padding:12px;font:inherit}
.field input{background:var(--panel2);color:var(--fg);border:1px solid var(--line);border-radius:12px;padding:12px;font:inherit}
.bar{height:6px;border-radius:3px;background:var(--panel2);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--yellow);transition:width .2s}
.prog{font-size:14px}
.prog b{font-weight:600}
.logbox{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;color:var(--muted);background:var(--panel2);border-radius:10px;padding:10px 12px;max-height:150px;overflow:auto;white-space:pre-wrap}
.done{background:color-mix(in srgb,var(--green) 14%,transparent);border:1px solid color-mix(in srgb,var(--green) 40%,transparent);border-radius:14px;padding:16px;display:grid;gap:8px}
.work .say,.done .say{font-family:var(--display);font-stretch:112%;font-weight:900;text-transform:uppercase;font-size:20px;color:var(--fg)}
.done code{background:var(--panel2);border-radius:6px;padding:2px 8px}
.fail{background:color-mix(in srgb,var(--red) 12%,transparent);border:1px solid color-mix(in srgb,var(--red) 40%,transparent);border-radius:14px;padding:16px;display:grid;gap:8px}
.banner{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:14px}
@media (prefers-reduced-motion:no-preference){.card{transition:border-color .15s}}

<div class="wrap" id="app">
  <div class="top">
    <div><h1>Reel Review</h1><div class="sub" id="sub">Watch, tap the moment, leave a note. Claude picks them up.</div></div>
  </div>
  <div id="main"><div class="empty">Loading reels…</div></div>
</div>

<script>
(() => {
  const $ = (s, r = document) => r.querySelector(s);
  const el = (tag, props = {}, ...kids) => { const n = document.createElement(tag); for (const [k, v] of Object.entries(props)) { if (k === 'class') n.className = v; else if (k.startsWith('on')) n.addEventListener(k.slice(2), v); else if (v !== undefined && v !== null) n.setAttribute(k, v); } for (const c of kids.flat()) if (c !== null && c !== undefined) n.append(c.nodeType ? c : document.createTextNode(String(c))); return n; };
  const fmt = (t) => { t = Math.max(0, t || 0); const m = Math.floor(t / 60), s = t - m * 60; return `${m}:${s < 10 ? '0' : ''}${s.toFixed(1)}`; };
  const statusOf = (r, open) => r.status === 'approved' ? ['approved', 'Approved'] : open > 0 ? ['changes', `${open} note${open > 1 ? 's' : ''} open`] : ['review', 'Ready to review'];
  const api = async (p, opts) => { const res = await fetch('/api' + p, {headers: {'content-type': 'application/json'}, ...opts}); if (!res.ok) throw new Error((await res.json().catch(() => ({}))).error || res.status); return res.json(); };
  const main = $('#main');
  let reels = [], jobs = [], current = null, poll = null;

  // brand colours drive the pills, ticks and punch colour
  (async () => {
    try {
      const b = await api('/brand');
      const c = b.colours || {};
      if (c.punch) document.documentElement.style.setProperty('--yellow', c.punch);
      if (c.accent) document.documentElement.style.setProperty('--blue', c.accent);
      if (b.name) $('h1').textContent = 'Reel Review';
    } catch {}
  })();

  const setPoll = (fn) => { if (poll) clearInterval(poll); poll = fn ? setInterval(fn, 4000) : null; };

  async function boot(opts = {}) {
    document.body.classList.remove('ws');
    try { [reels, jobs] = await Promise.all([api('/reels'), api('/jobs').catch(() => [])]); }
    catch { main.replaceChildren(el('div', {class: 'empty'}, el('b', {}, 'The review studio is not running. '), 'Ask Claude to start it, or run ', el('code', {}, 'node engine/reel.mjs studio'), ' and reload.')); return; }
    // a reload in the middle of a prep comes straight back to the job it left
    const live = jobs.find((j) => j.state === 'running');
    if (live && !opts.stayOnList) return openJob(live.slug);
    renderList();
    setPoll(async () => { try { [reels, jobs] = await Promise.all([api('/reels'), api('/jobs').catch(() => [])]); if (!current) renderList(); } catch {} });
  }

  // What I know about your style: everything the editor has learned, in plain words. Rules only count
  // once she says yes, so the ones waiting get a Yes / Not for me right here.
  async function renderStyleMemory() {
    setPoll(null); current = null;
    $('#sub').textContent = 'What I know about your style';
    let m;
    try { m = await api('/style-memory'); } catch { main.replaceChildren(el('div', {class: 'err'}, 'Could not read your style just now.')); return; }
    const col = (title, items, empty) => el('div', {class: 'box'}, el('h2', {}, title), items.length ? el('ul', {class: 'smlist'}, ...items.map((x) => el('li', {}, x))) : el('div', {class: 'hint'}, empty));
    const pend = m.pending.map((r) => {
      const yes = el('button', {class: 'btn y', style: 'padding:6px 14px'}, 'Yes, always');
      const no = el('button', {class: 'btn', style: 'padding:6px 14px'}, 'Not for me');
      const go = async (decision, b) => { b.disabled = true; try { await api('/style-memory/rule', {method: 'POST', body: JSON.stringify({id: r.id, decision})}); renderStyleMemory(); } catch (e) { b.disabled = false; alert(String(e.message || e)); } };
      yes.onclick = () => go('approve', yes); no.onclick = () => go('reject', no);
      return el('div', {class: 'smrule'}, el('b', {}, r.label), el('div', {class: 'hint'}, r.because), r.example ? el('div', {class: 'hint', style: 'font-style:italic'}, `Your note: “${r.example.slice(0, 140)}”`) : null, el('div', {class: 'row', style: 'margin-top:8px'}, yes, no));
    });
    main.replaceChildren(
      el('button', {class: 'back', style: 'margin-bottom:12px', onclick: () => boot({stayOnList: true})}, '← All reels'),
      el('div', {class: 'hint', style: 'margin-bottom:12px'}, 'Everything I have learned about how you like your reels. I read this before every cut. Nothing becomes a rule until you say yes.'),
      el('div', {class: 'smgrid'}, col('You like', m.likes, 'Nothing yet. It fills in as you leave notes.'), col('You avoid', m.avoid, 'Nothing yet.')),
      pend.length ? el('div', {class: 'box', style: 'margin-top:14px'}, el('h2', {}, `Waiting for your yes (${pend.length})`), el('div', {class: 'hint', style: 'margin-bottom:10px'}, 'I noticed these in your notes. Say yes and I follow them on every reel from now on.'), ...pend) : '',
      el('div', {class: 'smgrid', style: 'margin-top:14px'},
        col('Your rules', m.rules.map((r) => r.label + (r.because ? ` (${r.because})` : '')), 'No rules yet: approve one above and it lands here.'),
        col('My words', m.words.map((w) => `“${w.heard}” is always written “${w.write}”`), 'None saved yet.')));
  }

  function renderList() {
    document.body.classList.remove('ws');
    $('#sub').textContent = 'Watch, tap the moment, leave a note. Claude picks them up.';
    const banners = jobs.filter((j) => (j.state === 'ready' || j.state === 'failed') && !(j.state === 'ready' && j.go && reels.some((r) => r.slug === j.slug))).map((j) => j.state === 'ready'
      ? el('div', {class: 'banner'}, el('span', {}, j.go ? '✅' : '📥'),
          el('span', {}, el('b', {}, j.slug), j.go ? ' is with the editor. Open it for the plan and progress.' : ' is prepped. Next: your notes, then the style.'),
          el('button', {class: j.go ? 'btn' : 'btn y', style: 'margin-left:auto;padding:6px 14px', onclick: () => j.go ? renderBriefed(j) : renderBrief(j)}, j.go ? 'Open' : 'Add notes + style →'),
          el('button', {class: 'btn', style: 'padding:6px 14px', onclick: () => clearJob(j.slug)}, 'Clear'))
      : el('div', {class: 'banner'}, el('span', {}, '⚠️'), el('span', {}, el('b', {}, j.slug), ' did not finish. ', j.error || 'Ask Claude what happened.'), el('button', {class: 'btn', style: 'margin-left:auto;padding:6px 14px', onclick: () => clearJob(j.slug)}, 'Dismiss')));
    const newBtn = el('button', {class: 'btn y', onclick: () => renderNew()}, '+ New reel');
    const head = el('div', {class: 'row', style: 'justify-content:space-between;margin-bottom:12px'}, el('span', {class: 'hint'}, 'Drop footage here to start one, or open a cut to review it.'), el('div', {class: 'row'}, el('button', {class: 'btn', onclick: () => renderStyleMemory()}, 'My style'), el('button', {class: 'btn', onclick: () => renderTaste()}, 'Taste test'), newBtn));
    if (!reels.length) {
      main.replaceChildren(...banners, head, el('div', {class: 'empty'}, el('b', {}, 'No reels yet. '), 'Tap ', el('b', {}, '+ New reel'), ' and drag your footage in, and Claude cuts it. When a cut is finished it lands here with its timeline: open it, play, and tap “Add note” at any moment.'));
      return;
    }
    main.replaceChildren(...banners, head, el('div', {class: 'list'}, reels.map((r) => {
      const [cls, txt] = statusOf(r, r.openNotes || 0);
      return el('button', {class: 'card', onclick: () => openReel(r.slug)},
        el('div', {class: 't'}, r.title || r.slug),
        el('div', {class: 'm'}, el('span', {class: `pill ${cls}`}, txt), el('span', {}, `v${r.version || 1}`), el('span', {}, fmt(r.duration || 0).replace(/\.\d$/, '') + ' long')),
        r.summary ? el('div', {class: 'hint'}, r.summary) : null);
    })));
  }

  async function clearJob(slug) {
    try { await fetch('/api/jobs/' + encodeURIComponent(slug), {method: 'DELETE'}); } catch {}
    jobs = jobs.filter((j) => j.slug !== slug);
    renderList();
  }

  const MB = (b) => b >= 1e9 ? (b / 1e9).toFixed(1) + ' GB' : Math.max(1, Math.round(b / 1e6)) + ' MB';
  const slugify = (name) => name.replace(/\.[^.]+$/, '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 40) || 'reel';

  // The drop zone. It collects footage and runs the mechanical prep, and stops there:
  // the plan and the cut are Claude's, in the chat.
  function renderNew(addSlug = null) {
    document.body.classList.remove('ws');
    setPoll(null); current = null;
    let picked = [];
    const input = el('input', {type: 'file', multiple: '', accept: 'video/*,audio/*,image/*', style: 'display:none'});
    const zone = el('div', {class: 'drop', tabindex: '0', role: 'button'},
      el('b', {}, 'Drag your footage here'),
      el('div', {class: 'hint'}, 'Video, audio or stills, straight off your phone or your desktop. Or tap to choose files.'));
    const chosen = el('div', {class: 'files'});
    const slugIn = el('input', {id: 'slug', placeholder: 'client-launch', autocapitalize: 'off', autocorrect: 'off', spellcheck: 'false', value: addSlug ?? null, disabled: addSlug ? '' : null});
    const go = el('button', {class: 'btn y', disabled: ''}, addSlug ? 'Add it to ' + addSlug : 'Prep this footage');

    const barWrap = el('div', {class: 'bar', style: 'display:none'}, bar);
    const msg = el('div', {class: 'prog hint'}, 'Nothing dropped yet.');
    const err = el('div', {class: 'err'});

    const show = () => {
      chosen.replaceChildren(...picked.map((f) => el('div', {}, el('span', {}, f.name), el('span', {}, MB(f.size)))));
      go.disabled = !picked.length;
      msg.textContent = picked.length ? `${picked.length} file${picked.length > 1 ? 's' : ''} ready, ${MB(picked.reduce((a, f) => a + f.size, 0))} in total.` : 'Nothing dropped yet.';

    zone.onkeydown = (ev) => { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); input.click(); } };

    zone.addEventListener('drop', (e) => { e.preventDefault(); take(e.dataTransfer.files); });

    if (!window.__dropGuard) { window.__dropGuard = true; for (const ev of ['dragover', 'drop']) document.addEventListener(ev, (e) => { if (!e.target.closest('.drop')) e.preventDefault(); }); }

    go.onclick = async () => {
      const slug = (addSlug || slugIn.value).trim().toLowerCase();
      if (!/^[a-z0-9][a-z0-9-]{0,40}$/.test(slug)) { err.textContent = 'Name it with lower-case letters, numbers and dashes, like client-launch.'; slugIn.focus(); return; }
      go.disabled = true; err.textContent = '';
      // check before sending hundreds of MB: only one lot preps at a time
      try {
        const busy = (await api('/jobs')).find((x) => x.state === 'running');
        if (busy) {
          const same = !addSlug && picked.every((f) => (busy.files || []).includes(f.name));
          err.replaceChildren(same ? `These clips are already being prepped as “${busy.slug}”. ` : `“${busy.slug}” is still being prepared. Wait for it to finish, then drop this lot. `,
            el('button', {class: 'btn', style: 'margin-left:6px;padding:4px 12px', onclick: () => openJob(busy.slug)}, 'Open ' + busy.slug));
          go.disabled = false; return;
        }
      } catch (e) { /* fall through: the server still refuses a second drop */ }
      barWrap.style.display = 'block';
      const fd = new FormData();
      for (const f of picked) fd.append('file', f, f.name);
      try {
        await new Promise((resolve, reject) => {
          const x = new XMLHttpRequest();
          x.open('POST', '/api/inbox');
          x.upload.onprogress = (e) => { if (e.lengthComputable) { bar.style.width = (e.loaded / e.total * 100) + '%'; msg.textContent = `Copying your footage in… ${MB(e.loaded)} of ${MB(e.total)}.`; } };
          x.onload = () => x.status === 200 ? resolve() : reject(new Error(JSON.parse(x.responseText || '{}').error || 'upload failed'));
          x.onerror = () => reject(new Error('The studio stopped answering. Is it still running?'));
          x.send(fd);
        });
        msg.textContent = 'Footage copied in. Getting it ready…';
        if (addSlug) await api(`/jobs/${encodeURIComponent(addSlug)}/add`, {method: 'POST', body: '{}'});
        else await api('/jobs', {method: 'POST', body: JSON.stringify({slug})});
        openJob(addSlug || slug);
      } catch (e) {
        err.textContent = String(e.message || e);
        barWrap.style.display = 'none'; go.disabled = false;
      }
    };

    main.replaceChildren(
      el('button', {class: 'back', style: 'margin-bottom:12px', onclick: () => boot({stayOnList: true})}, '← All reels'),
      el('div', {class: 'box', style: 'max-width:620px'},
        stepsBar(1), el('h2', {}, addSlug ? 'Add to ' + addSlug : 'New reel'),
        el('div', {class: 'hint'}, addSlug
          ? 'More footage for this reel: b-roll, a second take, screenshots, photos. It gets ready the same way and joins the same project.'
          : 'This copies your footage in and gets it ready: proxies, a transcript and contact sheets. Then you tell it what the reel is about.'),
        zone, input, chosen,
        el('div', {class: 'field'}, el('label', {for: 'slug'}, 'Call this reel'), slugIn),
        el('div', {class: 'row'}, go, msg), barWrap, err));
    $('#sub').textContent = 'New reel';
    show();
  }

  // Where the reel actually gets briefed. The page cannot start Claude: it takes everything off the
  // owner here so that the chat has nothing left to ask.
  function renderBrief(j) {
    document.body.classList.remove('ws');
    setPoll(null); current = null;
    $('#sub').textContent = j.slug;
    const ta = el('textarea', {id: 'brief', placeholder: 'This is a reel about… I want the hook on the bit where I say… add b-roll of… use the photos I dropped in…', 'aria-label': 'What this reel is about'}, j.brief || '');
    const saved = el('div', {class: 'hint'});
    const err = el('div', {class: 'err'});
    const send = async (go, btn) => {
      btn.disabled = true; err.textContent = '';
      try {
        await api('/jobs/' + encodeURIComponent(j.slug), {method: 'PATCH', body: JSON.stringify({brief: ta.value, go})});
        j.brief = ta.value; j.go = go; renderBriefed(j);
      } catch (e) { err.textContent = String(e.message || e); btn.disabled = false; }
    };
    const nextBtn = el('button', {class: 'btn y'}, 'Next: choose a style →');
    nextBtn.onclick = () => { j.brief = ta.value; renderStyle(j); };
    const planBtn = nextBtn, cutBtn = el('span', {});
    main.replaceChildren(
      el('button', {class: 'back', style: 'margin-bottom:12px', onclick: () => boot({stayOnList: true})}, '← All reels'),
      el('div', {class: 'box', style: 'max-width:620px'},
        stepsBar(2),
        el('h2', {}, j.slug),
        el('div', {class: 'hint'}, el('b', {}, 'Your footage is ready.'), ' ', `${(j.files || []).length} file${(j.files || []).length === 1 ? '' : 's'} in, with the transcript and contact sheets done. Add more, or tell me what you want and I will start on it.`),
        el('div', {class: 'row'}, el('button', {class: 'btn', onclick: () => renderNew(j.slug)}, '+ Add more footage')),
        el('div', {class: 'field'}, el('label', {for: 'brief'}, 'What is this reel about? (optional)'), ta),
        el('div', {class: 'hint'}, 'Anything you would have said out loud: the point of it, the line that matters, b-roll or photos you want in, a reel of someone else’s to match. Or leave it empty and let me choose.'),
        el('div', {class: 'row'}, planBtn, cutBtn), saved, err));
  }

  const stepsBar = (n) => el('div', {class: 'steps'}, ...['Footage', 'Notes', 'Style', 'Review'].map((s, i) => el('span', {class: i + 1 === n ? 'on' : ''}, `${i + 1} ${s}`)));
  let LIB = null, TPL = null, BRAND = null, LOOKS = [];
  // Step 3: the look. Their brand guide, a ready-made template, or Claude's call; then the effects
  // (every one shown as a still from the library) and the caption style. All of it goes to Claude
  // in the handoff file, so the cut uses exactly these picks.
  async function renderStyle(j) {
    document.body.classList.remove('ws');
    $('#sub').textContent = j.slug + ' · style';
    if (!LIB) main.replaceChildren(el('div', {class: 'box', style: 'max-width:620px'}, stepsBar(3), el('div', {class: 'hint'}, 'Loading the styles and effects…')));
    if (!LIB) { try { [LIB, TPL, BRAND, LOOKS] = await Promise.all([api('/effects'), api('/templates'), api('/brand'), api('/looks').catch(() => [])]); } catch (e) { LIB = {groups: [], effects: []}; TPL = []; BRAND = {}; } }
    const st = Object.assign({mode: 'brand', template: null, effects: [], claudeEffects: false, captions: null, energy: (BRAND && BRAND.energy) || 'balanced', cutFirst: false, sameAs: null}, j.style || {});
    let last = null; try { last = await api('/last-style?except=' + encodeURIComponent(j.slug)); if (!last || !last.style) last = null; } catch {}
    const KEYS = ['mode', 'template', 'effects', 'claudeEffects', 'captions', 'energy'];
    let before = null;
    const sameBox = el('div', {}), cutBox = el('div', {});
    const err = el('div', {class: 'err'});
    let group = 'all';
    const lookBox = el('div', {});
    const modesBox = el('div', {class: 'modes'}), energyBox = el('div', {}), tplBox = el('div', {}), fxBox = el('div', {}), capBox = el('div', {});
    const cols = BRAND && BRAND.colours ? Object.values(BRAND.colours).slice(0, 5) : [];
    const paint = () => {
      if (last) {
        const cb = el('input', {type: 'checkbox', id: 'same'}); cb.checked = st.sameAs === last.slug;
        cb.onchange = () => {
          if (cb.checked) { before = Object.fromEntries(KEYS.map((k) => [k, st[k]])); for (const k of KEYS) if (k in last.style) st[k] = Array.isArray(last.style[k]) ? last.style[k].slice() : last.style[k]; st.sameAs = last.slug; }
          else { if (before) Object.assign(st, before); st.sameAs = null; }
          paint();
        };
        sameBox.replaceChildren(el('label', {class: 'check', for: 'same', style: 'margin-bottom:10px'}, cb, el('span', {}, el('b', {}, 'Same as last time.'), ` Use the look from ${last.slug}, just for this reel.`)));
      }
      const cf = el('input', {type: 'checkbox', id: 'cutfirst'}); cf.checked = !!st.cutFirst; cf.onchange = () => { st.cutFirst = cf.checked; };
      cutBox.replaceChildren(el('label', {class: 'check', for: 'cutfirst'}, cf, el('span', {}, el('b', {}, 'Cut first.'), ' Show me the cut line by line, with a plain preview, so I can keep or cut lines before any styling.')));
      const mode = (id, title, sub, extra) => el('button', {class: 'mode' + (st.mode === id ? ' on' : ''), onclick: () => { st.mode = id; if (id === 'claude') st.claudeEffects = true; paint(); }}, el('b', {}, title), el('span', {class: 'hint'}, sub), extra || null);
      modesBox.replaceChildren(
        mode('brand', 'My brand guide', 'Your fonts, colours and rules.' + (BRAND && BRAND.fonts && BRAND.fonts.display ? ' ' + BRAND.fonts.display + ' + ' + (BRAND.fonts.serif || '') : ''), el('div', {class: 'swatches'}, ...cols.map((c) => el('i', {style: 'background:' + c})))),
        mode('template', 'A template', 'A ready-made look, in your fonts and colours.'),
        mode('claude', 'Let Claude choose', 'I pick the look and the effects from your footage.'));
      // the look: their own brand, or one of the starter looks (fonts, colours and pace together)
      lookBox.replaceChildren(LOOKS.length ? el('div', {class: 'field'}, el('label', {}, 'Look'),
        el('div', {class: 'tgrid'}, el('button', {class: 'tile' + (!st.look ? ' on' : ''), onclick: () => { st.look = null; paint(); }},
          el('div', {style: 'aspect-ratio:9/16;border-radius:10px;display:grid;place-items:center;background:var(--panel2,#222);font-weight:700'}, 'Your brand'), el('div', {class: 'nm'}, 'My brand'), el('div', {class: 'ds'}, 'Your own fonts and colours.')),
          ...LOOKS.map((l) => el('button', {class: 'tile' + (st.look === l.id ? ' on' : ''), title: l.blurb, onclick: () => { st.look = l.id; paint(); }},
            el('img', {src: l.img, alt: '', loading: 'lazy'}), el('div', {class: 'nm'}, l.name), el('div', {class: 'ds'}, l.blurb))))) : '');
